<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATEMATE - Find Deliveries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align content to the top */
            padding: 2rem;
        }
        /* Custom scrollbar for better appearance if many orders */
        .overflow-y-auto::-webkit-scrollbar {
            width: 8px;
        }
        .overflow-y-auto::-webkit-scrollbar-track {
            background: #e2e8f0; /* bg-gray-200 */
            border-radius: 4px;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background: #a78bfa; /* bg-purple-400 */
            border-radius: 4px;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background: #8b5cf6; /* bg-purple-500 */
        }
    </style>
</head>
<body class="antialiased">

    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between z-10 sticky top-0">
        <div class="flex items-center space-x-2">
            <img src="kamm.jpg" alt="GATEMATE Logo" class="h-12 w-12">
            <span class="text-2xl font-extrabold text-gray-800">GATEMATE</span>
        </div>
        <nav class="flex items-center space-x-8 text-gray-600 font-medium">
            <a href="dashboard.html" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 12L12 3L21 12H18V20H15V14H9V20H6V12H3Z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="post_order_request.html" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>Post Order</span>
            </a>
            <a href="find_deliveries.html" class="flex items-center space-x-2 p-2 rounded-lg bg-purple-100 text-purple-700 font-semibold shadow-inner">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>Find Deliveries</span>
            </a>
            </nav>
    </header>

    <main>
        <div class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100 w-full max-w-2xl flex flex-col">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Available Orders for Delivery</h2>

            <div id="statusMessage" class="hidden mb-4 p-3 rounded-lg text-center text-sm font-medium"></div>

            <div id="ordersContainer" class="space-y-4 overflow-y-auto max-h-[calc(100vh-250px)]">
                <p class="text-gray-500 text-center py-8" id="noOrdersMessage">Loading orders...</p>
            </div>
        </div>
    </main>

    <script type="module" src="find_deliveries.js"></script>
</body>
</html>
