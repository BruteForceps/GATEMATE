<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212; /* Dark, true black background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
            padding: 20px; /* Add some padding for smaller screens */
            box-sizing: border-box;
        }
    </style>
</head>
<body class="antialiased">
    <div class="w-full max-w-md bg-gradient-to-br from-blue-950 to-blue-800 p-8 rounded-2xl shadow-2xl border border-blue-700 transform hover:scale-105 transition-all duration-300 ease-in-out">
        <h1 class="text-4xl font-extrabold text-center mb-3 text-white tracking-wide">Log In</h1>
        <p class="text-center text-blue-200 mb-8 text-lg">Welcome back! Please log in to your account.</p>

        <form id="loginForm" action="javascript:void(0);" method="POST">
            <hr class="border-t-2 border-blue-700 opacity-50 mb-8">

            <div class="mb-6">
                <label for="email" class="block text-blue-100 text-sm font-semibold mb-2">Email Address</label>
                <input type="email" placeholder="your.email@vitstudent.ac.in" name="email" id="emailInput" required
                       class="w-full px-5 py-3 bg-blue-900 text-white border border-blue-700 rounded-xl focus:outline-none focus:ring-3 focus:ring-blue-400 focus:border-blue-500 transition duration-300 ease-in-out placeholder-blue-400 text-base shadow-inner">
                </div>

            <div class="mb-8">
                <label for="psw" class="block text-blue-100 text-sm font-semibold mb-2">Password</label>
                <input type="password" placeholder="••••••••" name="psw" id="passwordInput" required
                       class="w-full px-5 py-3 bg-blue-900 text-white border border-blue-700 rounded-xl focus:outline-none focus:ring-3 focus:ring-blue-400 focus:border-blue-500 transition duration-300 ease-in-out placeholder-blue-400 text-base shadow-inner">
                <span id="loginError" class="text-red-400 text-sm mt-2 hidden"></span>
            </div>

            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center">
                    <input type="checkbox" checked="checked" name="remember" id="remember"
                           class="h-5 w-5 text-blue-400 focus:ring-blue-300 border-blue-600 rounded-md cursor-pointer">
                    <label for="remember" class="ml-3 text-blue-100 text-base select-none">Remember me</label>
                </div>
                <a href="#" class="text-blue-400 hover:text-blue-300 text-sm font-bold transition duration-200 ease-in-out underline-offset-4 hover:underline">Forgot password?</a>
            </div>

            <div class="flex flex-col sm:flex-row gap-5">
                <button type="button"
                        class="cancelbtn w-full sm:w-1/2 bg-gray-700 text-white py-3.5 px-6 rounded-xl font-bold hover:bg-gray-600 transition duration-300 ease-in-out shadow-lg transform hover:-translate-y-1">
                    Cancel
                </button>
                <button type="submit" id="loginBtn"
                        class="loginbtn w-full sm:w-1/2 bg-blue-600 text-white py-3.5 px-6 rounded-xl font-bold hover:bg-blue-700 transition duration-300 ease-in-out shadow-lg transform hover:-translate-y-1">
                    Log In
                </button>
            </div>

            <p class="text-center text-blue-200 text-sm mt-8">
                Don't have an account?
                <a href="index.html" class="text-blue-400 hover:text-blue-300 font-bold transition duration-200 ease-in-out underline-offset-4 hover:underline">Sign Up</a>
            </p>
        </form>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
