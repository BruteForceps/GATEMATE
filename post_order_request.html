<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATEMATE - Post Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column; /* Changed to column for header + main content */
            min-height: 100vh;
            color: #333;
        }
        main {
            flex-grow: 1; /* Allows main content to take available space */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top */
            padding: 2rem; /* Add padding around the form */
        }
    </style>
</head>
<body class="antialiased">

    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between z-10 sticky top-0">
        <div class="flex items-center space-x-2">
            <img src="kamm.jpg" alt="GATEMATE Logo" class="h-12 w-12">
            <span class="text-2xl font-extrabold text-gray-800">GATEMATE</span>
        </div>
        <nav class="flex items-center space-x-8 text-gray-600 font-medium">
            <a href="dashboard.html" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 12L12 3L21 12H18V20H15V14H9V20H6V12H3Z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="post_order_request.html" class="flex items-center space-x-2 p-2 rounded-lg bg-purple-100 text-purple-700 font-semibold shadow-inner">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>Post Order</span>
            </a>
            <a href="find_deliveries.html" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>Find Deliveries</span>
            </a>
            </nav>
    </header>

    <main>
        <div class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100 w-full max-w-lg">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Post New Order Request</h2>

            <div id="statusMessage" class="hidden mb-4 p-3 rounded-lg text-center text-sm font-medium"></div>

            <form id="postOrderForm" action="javascript:void(0);">
                <div class="mb-6">
                    <label for="userName" class="block text-gray-700 text-sm font-semibold mb-2">Your Name</label>
                    <input type="text" id="userName" name="userName" placeholder="e.g., John Doe" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors duration-200">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Payment Method</label>
                    <div class="flex gap-4">
                        <button type="button" id="paymentCodBtn" class="flex-1 bg-gray-200 text-gray-800 py-3 px-4 rounded-xl font-semibold hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50 transition-colors duration-200">
                            Cash On Delivery (COD)
                        </button>
                        <button type="button" id="paymentPrepaidBtn" class="flex-1 bg-gray-200 text-gray-800 py-3 px-4 rounded-xl font-semibold hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50 transition-colors duration-200">
                            Prepaid
                        </button>
                    </div>
                    <input type="hidden" name="paymentMethod" id="paymentMethodInput" required>
                </div>

                <div class="mb-6">
                    <label for="blockName" class="block text-gray-700 text-sm font-semibold mb-2">Block Name</label>
                    <select id="blockName" name="blockName" required
                             class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors duration-200">
                        <option value="" disabled selected>Select your block</option>
                        <option value="Block A">Block A</option>
                        <option value="Block B">Block B</option>
                        <option value="Block C">Block C</option>
                        <option value="Block D1">Block D1</option>
                        <option value="Block D2">Block D2</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label for="orderOrigin" class="block text-gray-700 text-sm font-semibold mb-2">From where did you order?</label>
                    <input type="text" id="orderOrigin" name="orderOrigin" placeholder="e.g., Domino's, McDonald's, Local Cafe" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors duration-200">
                </div>

                <div class="mb-6">
                    <label for="orderDescription" class="block text-gray-700 text-sm font-semibold mb-2">What did you order?</label>
                    <textarea id="orderDescription" name="orderDescription" rows="3" placeholder="e.g., 1 large Margherita pizza, 2 coke, 1 garlic bread" required
                                  class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors duration-200 resize-y"></textarea>
                </div>

                <div class="mb-8">
                    <label for="orderAmount" class="block text-gray-700 text-sm font-semibold mb-2">Amount of the order (₹)</label>
                    <input type="number" id="orderAmount" name="orderAmount" placeholder="e.g., 500" min="1" step="any" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors duration-200">
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <button type="button" id="backToDashboardBtn" class="w-full sm:w-1/2 bg-gray-300 text-gray-800 py-3 px-6 rounded-xl font-bold hover:bg-gray-400 transition duration-300 ease-in-out">
                        Cancel
                    </button>
                    <button type="submit" class="w-full sm:w-1/2 bg-purple-600 text-white py-3 px-6 rounded-xl font-bold hover:bg-purple-700 transition duration-300 ease-in-out shadow-lg">
                        Submit Order
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Link to your external JavaScript file -->
    <script type="module" src="post_order_request.js"></script>
</body>
</html>
